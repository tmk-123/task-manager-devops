name: Test, verify Docker stack, publish image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start MySQL, API and Nginx
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 240
      - name: Test through Nginx
        run: python3 scripts/smoke-test.py
      - name: Check persistence after recreating services
        run: |
          task_id=$(curl -fsS -H 'Content-Type: application/json' -d '{"title":"Persistence check","status":"TODO"}' http://localhost:8080/api/tasks | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          docker compose down
          docker compose up -d --wait --wait-timeout 240
          curl -fsS "http://localhost:8080/api/tasks/$task_id" | python3 -c 'import sys,json; assert json.load(sys.stdin)["title"] == "Persistence check"'
          curl -fsS -X DELETE "http://localhost:8080/api/tasks/$task_id"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up CI resources
        if: always()
        run: docker compose down --volumes
  publish:
    needs: [test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
