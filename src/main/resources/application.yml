spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskmanager}
    username: ${DB_USER:taskuser}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  shutdown: graceful
